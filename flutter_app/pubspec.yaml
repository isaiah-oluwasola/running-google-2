name: heyapp
description: HeyApp — Connect. Chat. Share. Native Flutter app (ported from index.html).
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.0.0          # minSdk 24
  firebase_auth: ^7.0.0          # minSdk 24
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.0
  supabase_flutter: ^2.8.0
  flutter_webrtc: ^0.12.0       # calls (audio/video)
  speech_to_text: ^7.0.0        # voice input
  permission_handler: ^11.3.1
  http: ^1.2.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
